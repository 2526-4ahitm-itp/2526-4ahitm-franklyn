baseURL: ''
locale: en
title: Franklyn

languages:
  en:
    label: English
    weight: 1
    contentDir: content/en
  de:
    label: Deutsch
    weight: 2
    contentDir: content/de


enableGitInfo: true

defaultContentLanguage: en
defaultContentLanguageInSubdir: true

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, markdown]

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content/en
      target: content
      sites:
        matrix:
          languages: [en]

    - source: content/de
      target: content
      sites:
        matrix:
          languages: [de]

    - source: content/en
      target: content
      sites:
        matrix:
          languages: [de]
markup:
  goldmark:
    renderer:
      unsafe: true
