version: 2

updates:
  # Vue frontend (bun)
  - package-ecosystem: "bun"
    directory: "/proctor"
    schedule:
      interval: "monthly"
    groups:
      bun-all:
        patterns: ["*"]
    open-pull-requests-limit: 15
    labels: ["dependencies", "proctor"]

  # Quarkus server: security updates only (see notes)
  - package-ecosystem: "maven"
    directory: "/server"
    schedule:
      interval: "monthly"
    groups:
      maven-all:
        patterns: ["*"]
    open-pull-requests-limit: 15
    labels: ["dependencies", "server"]

  # Rust client
  - package-ecosystem: "cargo"
    directory: "/sentinel"
    schedule:
      interval: "monthly"
    groups:
      cargo-all:
        patterns: ["*"]
    open-pull-requests-limit: 15
    labels: ["dependencies", "sentinel"]

  # Hugo docs
  - package-ecosystem: "gomod"
    directory: "/hugo"
    schedule:
      interval: "monthly"
    groups:
      gomod-all:
        patterns: ["*"]
    open-pull-requests-limit: 15
    labels: ["dependencies", "documentation"]

  # Nix flake inputs
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "nixpkgs-build"
      - dependency-name: "nixpkgs-compat"
    labels: ["dependencies", "nix"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  # Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/cicd/compose/aptly"
      - "/hugo/docker"
      - "/proctor/docker"
      - "/server/src/main/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 15
    groups:
      docker-all:
        patterns: ["*"]
    labels: ["dependencies", "docker"]

  # Compose files
  - package-ecosystem: "docker-compose"
    directories:
      - "/cicd/compose"
      - "/server/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 15
    groups:
      compose-all:
        patterns: ["*"]
    labels: ["dependencies", "docker"]