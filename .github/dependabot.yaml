version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "maven"
    directory: "/server"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "cargo"
    directory: "/sentinel"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "bun"
    directory: "/proctor"
    patterns: [ "*" ]
    multi-ecosystem-group: "all-dependencies"
    labels: [ "proctor" ]
  - package-ecosystem: "gomod"
    directory: "/hugo"
    patterns: [ "*" ]
    multi-ecosystem-group: "all-dependencies"
    labels: [ "documentation" ]

  - package-ecosystem: "nix"
    directory: "/"
    ignore:
      - dependency-name: "nixpkgs"
    patterns: [ "*" ]
    multi-ecosystem-group: "all-dependencies"
    labels: [ "nix" ]