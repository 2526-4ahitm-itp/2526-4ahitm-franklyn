version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
      day: "monday"
    labels: ["dependencies"]


updates:
  - package-ecosystem: "bun"
    directory: "/proctor"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels: ["proctor" ]

  - package-ecosystem: "maven"
    directory: "/server"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels: ["server"]

  - package-ecosystem: "cargo"
    directory: "/sentinel"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels: ["sentinel"]

  - package-ecosystem: "gomod"
    directory: "/hugo"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels: ["documentation"]

  - package-ecosystem: "nix"
    directory: "/"
    ignore:
      - dependency-name: "nixpkgs"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels: ["nix"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: [ "*" ]
    labels: ["ci"]