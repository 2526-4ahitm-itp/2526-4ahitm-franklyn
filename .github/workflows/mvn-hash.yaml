name: ❄️ Update Maven Hash

# Keeps server/mvn-hash.json (the Nix mvnHash of franklyn-server) in sync with
# server/pom.xml by recomputing it on Linux and macOS and committing the result.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - server/pom.xml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compute-hash:
    name: 🔢 Compute Hash (${{ matrix.key }})
    # Pushing back is impossible for fork PRs
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            key: linux
          - runner: macos-latest
            key: darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: ❄️ Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          environment: server
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN_V2 }}

      - name: 🔢 Compute Maven Hash
        run: server/scripts/update-mvn-hash.sh

      - name: 📦 Upload Hash File
        uses: actions/upload-artifact@v5
        with:
          name: mvn-hash-${{ matrix.key }}
          path: server/mvn-hash.json

  commit-hash:
    name: 💾 Commit Hash
    needs: compute-hash
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: mvn-hash-*
          path: hashes

      - name: 🔀 Merge Hashes
        run: |
          jq -n \
            --slurpfile linux hashes/mvn-hash-linux/mvn-hash.json \
            --slurpfile darwin hashes/mvn-hash-darwin/mvn-hash.json \
            '{linux: $linux[0].linux, darwin: $darwin[0].darwin}' > server/mvn-hash.json

      - name: 💾 Commit and Re-run PR Checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- server/mvn-hash.json; then
            echo "Maven hash already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(server): update maven dependency hash" -- server/mvn-hash.json
          # Fails if the branch moved meanwhile; the run for the newer commit takes over
          git push origin "HEAD:refs/heads/$BRANCH"

          # Pushes made with GITHUB_TOKEN do not trigger workflows, so start the PR checks for the new commit
          gh workflow run pr-checks.yaml --ref "$BRANCH"
