syntax = "proto3";

package franklyn.exam.common;

import "franklyn/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

message Exam {
  franklyn.common.v1.UUID id = 1;
  franklyn.common.v1.UUID teacher_id = 2;
  ExamState state = 3;
  string title = 4;
  int32 pin = 5;
  int32 preopen_time_minutes = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

enum ExamState {
  EXAM_STATE_UNSPECIFIED = 0;
  EXAM_STATE_SCHEDULED = 1;
  EXAM_STATE_OPEN = 2;
  EXAM_STATE_LIVE = 3;
  EXAM_STATE_ENDED = 4;
}
