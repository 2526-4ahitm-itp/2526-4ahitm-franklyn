version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bufbuild/buf-examples/gen
plugins:
  # rust
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: gen/rust
    opt:
      - bytes=.
      - file_descriptor_set
      - flat_output_dir

  - remote: buf.build/community/neoeinstein-prost-crate:v0.4.1
    out: gen/rust
    opt:
      - no_features

  # typescript
  - remote: buf.build/bufbuild/es:v2.14.0
    out: gen/ts
    opt: target=ts
